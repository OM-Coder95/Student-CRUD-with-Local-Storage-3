<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRUD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container pt-3 mb-5">
        <div class="row">
            <div class="col-md-12 text-center">
                <h3>Student Entrollment</h3>
                <h3>Manage Course Registration</h3>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <form class="form" id="form">
                    <div class="card">

                        <div class="card-header">
                            <h3>Add Entrollment</h3>
                        </div>

                        <div class="card-body">
                            <div class="form-group">
                                <div class="row">
                                    <label for="course" class="col-md-3">Course</label>

                                    <div class="col-md-9">
                                        <select id="course" class="form-control">
                                            <option value="" disabled>Select Course</option>
                                            <option value="Angular">Angular</option>
                                            <option value="React">React</option>
                                            <option value="Java">Java</option>
                                            <option value="Python">Python</option>
                                            <option value="UI/UX">UI/UX</option>
                                        </select>
                                    </div>
                                </div>
                            </div>


                            <div class="form-group">
                                <div class="row">
                                    <label for="skills" class="col-md-3">Skills</label>

                                    <div class="col-md-9">
                                        <div class="row">
                                            <div class="col-md-6">
                                                <input type="checkbox" name="skills"> HTML
                                            </div>
                                            <div class="col-md-6">
                                                <input type="checkbox" name="skills"> CSS
                                            </div>
                                            <div class="col-md-6">
                                                <input type="checkbox" name="skills"> JavaScript
                                            </div>
                                            <div class="col-md-6">
                                                <input type="checkbox" name="skills"> Bootstrap
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <div class="row">
                                    <label for="joiningDate" class="col-md-3">Join Date</label>

                                    <div class="col-md-9">
                                        <input type="date" class="form-control">
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <div class="row">

                                    <label for="feeStatus" class="col-md-3">Fee Status</label>

                                    <div class="col-md-9">
                                        <div>
                                            <label for="Pending"><input type="radio" name="feeStatus">Pending</label>
                                        </div>
                                        <div>
                                            <label for="Paid"><input type="radio" name="feeStatus">Paid</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>


                        <div class="form-group">
                            <button class="btn btn-sm btn-primary btn-block">Add Enrollment</button>
                        </div>

                    </div>
                </form>
            </div>

            <!-- Table -->

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>Enrollment Records</h4>
                    </div>

                    <div class="card-body">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Sr. No</th>
                                    <th>Course</th>
                                    <th>Skills</th>
                                    <th>Joining Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr>
                                    <td>1</td>
                                    <td>Angular</td>
                                    <td>html</td>
                                    <td>12-2-2026</td>
                                    <td>Active</td>
                                    <td class="d-flex justify-content-between">
                                        <button class="btn btn-sm btn-primary mr-2">Edit</button>
                                        <button class="btn btn-sm btn-danger">Delete</button>
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="col-md-8"></div>
    </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
